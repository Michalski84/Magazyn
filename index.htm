<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejestr Przesyłek</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Rejestr przesyłek przychodzących</h1>
    <button type="button" id="refreshAppButton" title="Odśwież aplikację">↻ Odśwież</button>
  </header>

  <div class="entry-workspace">
  <form id="shipmentForm">
    <label>Firma przewozowa: <input type="text" id="firma" required></label>
    <label>Numer listu przewozowego: <input type="text" id="numerListu" required></label>
    <label>Data przyjęcia: <input type="date" id="data" required></label>
    <label>Adresat: <input type="text" id="odbiorca" required></label>
    <label>Nadawca: <input type="text" id="nadawca" required></label>
    <label>Rodzaj przesyłki:
      <select id="rodzaj">
        <option value="Paczka">Paczka</option>
        <option value="Koperta">Koperta</option>
        <option value="Paleta">Paleta</option>
        <option value="Paleta">Inne</option>
      </select>
    </label>
    <label>Numer zamówienia: <input type="text" id="zamowienie"></label>
    <label>Numer projektu: <input type="text" id="projekt"></label>

 <div id="zawartoscContainer">
  <label>Zawartość:</label>
  <table style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr>
        <th>Nazwa</th>
        <th>Ilość</th>
        <th>Jednostka</th>
        <th>Numer seryjny</th>
        <th>Usuń</th>
      </tr>
    </thead>
    <tbody id="zawartoscFields">
      <!-- dynamiczne wiersze -->
    </tbody>
  </table>
  <button type="button" onclick="addZawartoscField()">Dodaj pozycję</button>
</div>

    <button type="submit" id="submitButton">Dodaj przesyłkę</button>
  </form>

  <section class="search-section">
  <h2>Wyszukiwanie</h2>
  <div class="search-toolbar">
    <input type="text" id="searchInput" placeholder="Wpisz szukaną frazę..." />
    <button type="button" id="resetFiltersButton">Resetuj filtry</button>
  </div>

  <div class="shipment-filters">
    <label for="statusFilter">Status:
      <select id="statusFilter">
        <option value="all">Wszystkie</option>
        <option value="na magazynie">Na magazynie</option>
        <option value="odebrane">Odebrane</option>
        <option value="częściowo odebrane">Częściowo odebrane</option>
      </select>
    </label>
    <label for="shipmentSort">Sortowanie:
      <select id="shipmentSort">
        <option value="default">Domyślne</option>
        <option value="oldest">Najstarsze najpierw</option>
        <option value="newest">Najnowsze najpierw</option>
      </select>
    </label>
    <label for="datePeriodFilter">Okres daty:
      <select id="datePeriodFilter">
        <option value="all">Dowolny</option>
        <option value="range">Własny zakres</option>
        <option value="month">Miesiąc i rok</option>
        <option value="last-month">Ostatni miesiąc (30 dni)</option>
        <option value="last-week">Ostatni tydzień (7 dni)</option>
      </select>
    </label>
    <div class="date-period-fields" id="dateRangeControls" hidden>
      <label for="dateFrom">Od:
        <input type="date" id="dateFrom">
      </label>
      <label for="dateTo">Do:
        <input type="date" id="dateTo">
      </label>
    </div>
    <div class="date-period-fields" id="monthControls" hidden>
      <label for="shipmentMonth">Miesiąc i rok:
        <input type="month" id="shipmentMonth">
      </label>
    </div>
  </div>

  <div class="search-columns">
    <label><input type="checkbox" class="search-col" value="firma" checked> Firma przewozowa</label>
    <label><input type="checkbox" class="search-col" value="numerListu" checked> Numer listu</label>
    <label><input type="checkbox" class="search-col" value="data" checked> Data przyjęcia</label>
    <label><input type="checkbox" class="search-col" value="odbiorca" checked> Adresat</label>
    <label><input type="checkbox" class="search-col" value="nadawca" checked> Nadawca</label>
    <label><input type="checkbox" class="search-col" value="rodzaj" checked> Rodzaj przesyłki</label>
    <label><input type="checkbox" class="search-col" value="zawartosc" checked> Zawartość</label>
    <label><input type="checkbox" class="search-col" value="zamowienie" checked> Numer zamówienia</label>
    <label><input type="checkbox" class="search-col" value="projekt" checked> Numer projektu</label>
  </div>
  <div class="spreadsheet-controls">
    <button type="button" id="exportExcelButton">Eksportuj do Excel</button>
    <button type="button" id="exportVisibleExcelButton">Eksportuj widok</button>
    <button type="button" id="importExcelButton">Importuj Excel</button>
    <input type="file" id="importExcelFile" accept=".xls" hidden>
  </div>
</section>
  </div>

  <hr>

<table id="shipmentsTable">
  <thead>
    <tr>
      <th>LP</th>
      <th>Firma</th>
      <th>Numer listu</th>
      <th>Data przyjęcia</th>
      <th>Adresat</th>
      <th>Nadawca</th>
      <th>Rodzaj</th>
      <th>Zawartość</th>
      <th>Zamówienie</th>
      <th>Numer projektu</th>
      <th>Akcje</th> 
      <th>Potwierdzenie odbioru</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="page-scroll-controls" aria-label="Przewijanie strony">
  <button type="button" id="scrollToTop" aria-label="Przewiń na początek strony" title="Początek strony">↑</button>
  <button type="button" id="scrollToBottom" aria-label="Przewiń na koniec strony" title="Koniec strony">↓</button>
</div>

  <div id="signatureModal">
  <div class="modal-content">
    <h3>Dane odbiorcy</h3>
    <label for="recipientNameInput">Imię i nazwisko odbiorcy</label>
    <input id="recipientNameInput" type="text" autocomplete="name" placeholder="Imię i nazwisko">
    <button type="button" onclick="saveSignature()">Zapisz</button>
    <button type="button" onclick="closeSignatureModal()">Zamknij</button>
  </div>
</div>

<div id="notesModal" class="notes-modal" role="dialog" aria-modal="true" aria-labelledby="notesModalTitle" aria-hidden="true">
  <section class="notes-dialog">
    <header class="notes-dialog-header">
      <h2 id="notesModalTitle">Notatki do przesyłki</h2>
      <button type="button" id="notesCloseButton" class="notes-close-button" aria-label="Zamknij notatki" title="Zamknij">×</button>
    </header>
    <label for="notesTextarea">Treść notatki</label>
    <textarea id="notesTextarea" rows="8"></textarea>
    <div class="notes-actions">
      <button type="button" id="notesSaveButton">Zapisz</button>
      <button type="button" id="notesEditButton">Edytuj</button>
      <button type="button" id="notesDeleteButton">Usuń</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="src/script.js"></script>
</body>
</html>
